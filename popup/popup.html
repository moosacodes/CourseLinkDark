<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CourseLink Dark</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="24" height="24">
    <h1>CourseLink Dark</h1>
  </header>
  <label class="row" for="toggle">
    <span class="label">
      <span class="title">Dark mode</span>
      <span class="status" id="status">…</span>
    </span>
    <span class="switch">
      <input type="checkbox" id="toggle" role="switch" aria-describedby="status">
      <span class="slider" aria-hidden="true"></span>
    </span>
  </label>
  <p class="hint">Applies instantly to open CourseLink tabs.</p>
  <script src="popup.js"></script>
</body>
</html>
